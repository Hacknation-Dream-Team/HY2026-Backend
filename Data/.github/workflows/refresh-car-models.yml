# Odświeżenie car_models z EEA. Uruchamiane ręcznie (Actions -> Run workflow),
# kiedy EEA opublikuje nowy rok. Wymaga sekretu repo DATABASE_URL (connection string do Neona).
# Połączenie psql samo wybudza uśpionego Neona.
name: refresh-car-models

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz surowe dane z EEA
        working-directory: scripts
        run: python load_eea_raw.py

      - name: Zainstaluj psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wgraj do Neona i odśwież car_models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          TRUNCATE eea_raw;
          \copy eea_raw FROM 'data/eea_raw.csv' WITH (FORMAT csv, HEADER true)
          CALL refresh_car_models();
          COMMIT;
          SQL
